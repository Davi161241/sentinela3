<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Atendimento — Sistema Hospitalar</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

```
<div class="container">

    <h2>🏥 Atendimento</h2>

    <!-- =========================
         DADOS PESSOAIS
    ========================== -->

    <input
        type="text"
        id="nome"
        placeholder="Nome completo"
    >

    <input
        type="text"
        id="cpf"
        placeholder="CPF"
    >

    <input
        type="text"
        id="rg"
        placeholder="RG"
    >

    <input
        type="date"
        id="dataNascimento"
    >

    <select id="sexo">
        <option value="">Selecione o sexo</option>
        <option value="Masculino">Masculino</option>
        <option value="Feminino">Feminino</option>
        <option value="Outro">Outro</option>
        <option value="Nao informado">Prefiro não informar</option>
    </select>

    <input
        type="text"
        id="nomeMae"
        placeholder="Nome da mãe"
    >

    <select id="estadoCivil">
        <option value="">Estado civil</option>
        <option value="Solteiro">Solteiro(a)</option>
        <option value="Casado">Casado(a)</option>
        <option value="Divorciado">Divorciado(a)</option>
        <option value="Viuvo">Viúvo(a)</option>
        <option value="Uniao estavel">União estável</option>
    </select>


    <!-- =========================
         ENDEREÇO
    ========================== -->

    <input
        type="text"
        id="endereco"
        placeholder="Endereço completo"
    >


    <!-- =========================
         CONTATO
    ========================== -->

    <input
        type="tel"
        id="telefone"
        placeholder="Telefone"
    >

    <input
        type="email"
        id="email"
        placeholder="E-mail"
    >

    <input
        type="tel"
        id="contatoEmergencia"
        placeholder="Contato de emergência"
    >


    <!-- =========================
         TIPO DE ATENDIMENTO
    ========================== -->

    <select id="tipo">

        <option value="Convenio">
            Convênio
        </option>

        <option value="Particular">
            Particular
        </option>

    </select>


    <!-- =========================
         FOTO
    ========================== -->

    <input
        type="file"
        id="foto"
        accept="image/*"
    >


    <!-- =========================
         BOTÃO
    ========================== -->

    <button
        type="button"
        id="btnCadastrar"
        onclick="cadastrar()"
    >
        Cadastrar
    </button>

</div>


<script>

    async function cadastrar() {

        // =========================
        // PEGAR DADOS
        // =========================

        const nome =
            document.getElementById("nome").value.trim();

        const cpf =
            document.getElementById("cpf").value.trim();

        const rg =
            document.getElementById("rg").value.trim();

        const dataNascimento =
            document.getElementById("dataNascimento").value;

        const sexo =
            document.getElementById("sexo").value;

        const nomeMae =
            document.getElementById("nomeMae").value.trim();

        const estadoCivil =
            document.getElementById("estadoCivil").value;

        const endereco =
            document.getElementById("endereco").value.trim();

        const telefone =
            document.getElementById("telefone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const contatoEmergencia =
            document
                .getElementById("contatoEmergencia")
                .value
                .trim();

        const tipo =
            document.getElementById("tipo").value;

        const fotoInput =
            document.getElementById("foto");

        const foto =
            fotoInput.files[0];


        // =========================
        // VALIDAÇÃO
        // =========================

        if (
            !nome ||
            !cpf ||
            !rg ||
            !dataNascimento ||
            !sexo ||
            !nomeMae ||
            !estadoCivil ||
            !endereco ||
            !telefone ||
            !email ||
            !contatoEmergencia
        ) {

            alert(
                "Preencha todos os campos obrigatórios."
            );

            return;
        }


        // =========================
        // DESABILITAR BOTÃO
        // =========================

        const botao =
            document.getElementById("btnCadastrar");

        botao.disabled = true;

        botao.textContent =
            "Cadastrando...";


        // =========================
        // CRIAR FORMDATA
        // =========================

        const formData =
            new FormData();

        formData.append(
            "nome",
            nome
        );

        formData.append(
            "cpf",
            cpf
        );

        formData.append(
            "rg",
            rg
        );

        formData.append(
            "dataNascimento",
            dataNascimento
        );

        formData.append(
            "sexo",
            sexo
        );

        formData.append(
            "nomeMae",
            nomeMae
        );

        formData.append(
            "estadoCivil",
            estadoCivil
        );

        formData.append(
            "endereco",
            endereco
        );

        formData.append(
            "telefone",
            telefone
        );

        formData.append(
            "email",
            email
        );

        formData.append(
            "contatoEmergencia",
            contatoEmergencia
        );

        formData.append(
            "tipo",
            tipo
        );


        // =========================
        // ADICIONAR FOTO
        // =========================

        if (foto) {

            formData.append(
                "foto",
                foto
            );

        }


        // =========================
        // ENVIAR PARA O BACKEND
        // =========================

        try {

            const response =
                await fetch(
                    "/atendimento",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            // =========================
            // LER RESPOSTA
            // =========================

            const data =
                await response.json();


            // =========================
            // VERIFICAR ERRO
            // =========================

            if (!response.ok) {

                throw new Error(
                    data.erro ||
                    "Erro ao cadastrar paciente."
                );

            }


            // =========================
            // SUCESSO
            // =========================

            console.log(
                "Paciente cadastrado:",
                data
            );

            alert(
                "Paciente enviado para triagem!"
            );


            // =========================
            // LIMPAR FORMULÁRIO
            // =========================

            document.getElementById(
                "nome"
            ).value = "";

            document.getElementById(
                "cpf"
            ).value = "";

            document.getElementById(
                "rg"
            ).value = "";

            document.getElementById(
                "dataNascimento"
            ).value = "";

            document.getElementById(
                "sexo"
            ).value = "";

            document.getElementById(
                "nomeMae"
            ).value = "";

            document.getElementById(
                "estadoCivil"
            ).value = "";

            document.getElementById(
                "endereco"
            ).value = "";

            document.getElementById(
                "telefone"
            ).value = "";

            document.getElementById(
                "email"
            ).value = "";

            document.getElementById(
                "contatoEmergencia"
            ).value = "";

            document.getElementById(
                "tipo"
            ).value = "Convenio";

            document.getElementById(
                "foto"
            ).value = "";


        } catch (erro) {

            console.error(
                "Erro ao cadastrar paciente:",
                erro
            );

            alert(
                "Não foi possível cadastrar o paciente.\n\n" +
                erro.message
            );

        } finally {

            // =========================
            // REATIVAR BOTÃO
            // =========================

            botao.disabled = false;

            botao.textContent =
                "Cadastrar";

        }

    }

</script>
```

</body>

</html>
