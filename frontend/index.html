```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hospitalar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(25,143,209,.10), transparent 35%),
                radial-gradient(circle at bottom right, rgba(18,111,168,.08), transparent 35%),
                linear-gradient(135deg, #f4f8fb, #eaf2f7);
            color: #1f2d3d;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,.97);
            padding: 38px 35px;
            border-radius: 20px;
            border: 1px solid #dce8ef;
            box-shadow: 0 20px 50px rgba(30,70,90,.12);
            position: relative;
            animation: aparecer .5s ease;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            border-radius: 20px 20px 0 0;
            background: linear-gradient(90deg, #126fa8, #198fd1, #4bb8e8);
        }

        h2 {
            color: #173b57;
            text-align: center;
            font-size: 25px;
            margin: 0 0 28px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            margin-top: 12px;
            border-radius: 10px;
            border: 1px solid #cfdde6;
            background: #fbfdfe;
            color: #263746;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: .2s;
        }

        input::placeholder {
            color: #8aa0ae;
        }

        input:focus {
            border-color: #198fd1;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(25,143,209,.12);
        }

        button {
            width: 100%;
            padding: 14px 15px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #198fd1, #126fa8);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(25,143,209,.20);
            transition: .2s;
        }

        button:hover {
            background: linear-gradient(135deg, #157fbd, #0e608f);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 32px 22px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🏥 Sistema Hospitalar</h2>

        <form id="formLogin">
            <input
                id="usuario"
                type="text"
                placeholder="Usuário"
                autocomplete="username"
                required
            >

            <input
                id="senha"
                type="password"
                placeholder="Senha"
                autocomplete="current-password"
                required
            >

            <button id="btnEntrar" type="submit">Entrar</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("formLogin");
        const botao = document.getElementById("btnEntrar");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;

            if (!usuario || !senha) {
                alert("Preencha o usuário e a senha.");
                return;
            }

            botao.disabled = true;
            botao.textContent = "Entrando...";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (!response.ok || !data.sucesso) {
                    alert(data.erro || "Usuário ou senha incorretos.");
                    return;
                }

                if (!data.usuario || !data.usuario.tipo) {
                    alert("O servidor não retornou o tipo de usuário.");
                    console.error("Resposta recebida:", data);
                    return;
                }

                const destinos = {
                    admin: "/admin.html",
                    atendimento: "/atendimento.html",
                    triagem: "/triagem.html",
                    medico: "/medico.html"
                };

                const destino = destinos[data.usuario.tipo];

                if (!destino) {
                    alert("Tipo de usuário não reconhecido: " + data.usuario.tipo);
                    console.error("Usuário recebido:", data.usuario);
                    return;
                }

                window.location.href = destino;

            } catch (error) {
                console.error("Erro ao fazer login:", error);
                alert("Não foi possível conectar ao servidor. Verifique se ele está funcionando.");
            } finally {
                botao.disabled = false;
                botao.textContent = "Entrar";
            }
        });
    </script>
</body>
</html>
